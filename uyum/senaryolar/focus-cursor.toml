id = "focus-cursor"
kaynak = "../uPlot/demos/focus-cursor.html"
fixture = "uygulamalar/ornekler/src/focus_cursor.rs#focus_cursor_kartları"
viewport = [1920, 600]
device_pixel_ratio = 1
durum = "dört-odak-alt-grafiği"

[veri]
dalga_noktasi = 130000
dalga_serileri = ["sin(x)", "cos(x)", "log(x)", "flat_one"]
performans_serisi = 300
log_sifir = "Math.log(0) kaynak hücresi sonlu-veri sözleşmesinde None"
ilk_iki_yuzey_ortak_depo = true

[odak]
alfa = [0.3, 1.1, 1.0, 0.1]
prox = [1000000, 30, 1000000, 1000000]
bias = [1, 0, 0, 0]
stiller = ["opacity", "unfocused-black", "focused-magenta", "opacity"]
pointer_guncellemesi = "retained stroke/fill/width; path d sabit"

[kanit]
masaustu = "uygulamalar/masaustu/src/main.rs"
gpui_web = "uygulamalar/web/src/main.rs"
svg = "target/focus-cursor/focus-cursor.svg"
