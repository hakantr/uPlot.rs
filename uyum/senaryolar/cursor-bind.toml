id = "cursor-bind"
"kaynak" = "../uPlot/demos/cursor-bind.html"
fixture = "src/kart/cursor_bind.rs#cursor_bind_kartı"
viewport = [1920, 600]
device_pixel_ratio = 1
"durum" = "etkileşimli"

["yüzey"]
"sayısı" = 1
"ilişki" = "bağımsız"
"başlık" = "Cursor Bind (try Ctrl + drag)"

[veri]
"x_değerleri" = "1..=30"
"değer_havuzu" = "-10..=10"
"seri_sayısı" = 3
"seri_uzunluğu" = 30
"kanıt_rastgele_üreteci" = "mulberry32"
"kanıt_tohumu" = "0xC0B1_1D00"
"yeniden_yükleme_farkı" = "kaynak Math.random; port tekrarlanabilir kanıt tohumu"

["imleç-bağı"]
api = "İmleçBağSeçenekleri"
"yalnız_birincil_tuş" = true
"normal_sürükleme" = "x-yakınlaştır"
"ctrl_sürükleme" = "setScale geçici kapalı + açıklama isteği"
"sıfır_sürükleme_eşiği" = "hareket varsa kaynak cursor.drag.dist=0"
"sürüklemesiz_tıklama" = "click! üst uygulamaya iletilir"
"ctrl_seçim_dolgusu" = "rgba(255,255,0,0.3)"
"ctrl_seçim_kenarlığı" = false
"istem" = "Annotation Text"
"gpui_modal" = true
"gpui_web_modal" = true
"iptal_tamam_enter" = "metin kalıcı çizime eklenmeden kapanır"

["etkileşim"]
"ortak_davranış_profili" = "resize-temeli-v1"
"tekerlek_x_yakınlaştır" = true
"seçim_yakınlaştır" = true
"çift_tıkla_tam_görünüm" = true
"dokunma_xy_yakınlaştır" = true
"boşluk_sol_sürükleme_taşıma" = true
"kaynak_üstü_uzantılar" = ["wheel", "touch", "pan", "history"]

[performans]
"bind_kararı" = "O(1)"
"click_iletimi" = "O(1)"
"ctrl_seçimi" = "ana sahne/veri yeniden çizilmez; yalnız seçim katmanı ve modal"
"veri_çizimi" = "30×3 seri O(N)"

["kanıt"]
"masaüstü" = "uygulamalar/masaustu/src/main.rs"
gpui_web = "uygulamalar/web/src/main.rs"
svg = "target/cursor-bind.svg"
