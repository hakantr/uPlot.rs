id = "cursor-tooltip"
kaynak = "../uPlot/demos/cursor-tooltip.html"
fixture = "uygulamalar/ornekler/src/cursor_tooltip.rs#cursor_tooltip_kartı"
viewport = [600, 400]
device_pixel_ratio = 1
durum = "etkilesimli-bilgi-kutusu"

[veri]
x = [1, 2, 3, 4, 5, 6, 7]
y = [40, 43, 60, 65, 71, 73, 80]
seri = "blah"

[davranis]
mouseenter_goster = true
mouseleave_gizle = true
metin = "x,y at cursorLeft,cursorTop"
yerlesim = "right/start"
sinir = "plot-over"
sagda_yer_yoksa_sola_don = true
gercek_kutu_olcusu = true
cursor_koordinati = "plot-local CSS pixels"
sahiplik = "hazir GPUI masaüstü/web yuzeyi"

[performans]
yerlesim = "O(1)"
pointer_birlestirme = "requestAnimationFrame"
ana_sahne_yeniden_cizimi = false

[kanit]
masaustu = "uygulamalar/masaustu/src/main.rs"
gpui_web = "uygulamalar/web/src/main.rs"
svg = "target/cursor-tooltip.svg"
