"dokunma_xy_yakınlaştır" = true
"boşluk_sol_sürükleme_taşıma" = true

[performans]
"yeni_sütun" = "O(N)"
"hizalı_yapı_doğrulama" = "O(N×S)"
"yeniden_çizim" = "O(N×S)"
"gpui_entity" = "korunur"
"wasm_dış_kabuk" = "korunur"
"svg_kökü" = "yerinde güncellenir"
