id = "bars-grouped-stacked"
kaynak = "../uPlot/demos/bars-grouped-stacked.html"
fixture = "uygulamalar/ornekler/src/bars_grouped_stacked.rs#bars_grouped_stacked_kartı"
viewport = [800, 400]
device_pixel_ratio = 1
durum = "on-alt-grafik"
sunum = "tek-kartta-kaynak-sirasiyla-on-bagimsiz-yuzey"

[veri]
kategoriler = ["Group A", "Group B", "Group C", "Group D"]
metric_1 = [1, 2, 3, 10]
metric_2 = [3, 2, 1, 10]
metric_3 = [5, 9, 3, 10]
tek_grup = [1, 3, 5]

["düzen"]
"alt_grafik_sayısı" = 10
"yüzeyler_bağımsız" = true
"kaynak_sırası" = [
  "cok-grup-cok-seri-dikey-gruplu",
  "cok-grup-cok-seri-dikey-yigilmis",
  "cok-grup-cok-seri-yatay-gruplu",
  "cok-grup-cok-seri-yatay-yigilmis",
  "cok-grup-tek-seri-dikey-gruplu",
  "cok-grup-tek-seri-dikey-yigilmis",
  "tek-grup-cok-seri-dikey-gruplu",
  "tek-grup-cok-seri-dikey-yigilmis",
  "tek-grup-tek-seri-dikey-gruplu",
  "tek-grup-tek-seri-dikey-yigilmis",
]
"yönler" = ["dikey", "yatay"]
kipler = ["gruplanmış", "yığılmış"]
"grup_genişliği" = 0.9
"çubuk_genişliği" = 1.0
"dağılım" = "SPACE_BETWEEN"
tek_grup_ve_tek_seri = true
"gruplu_y_aralığı" = [0.0, 11.0]
"yığılmış_y_aralığı" = [0.0, 32.0]
"aralık_algoritması" = "uPlot.rangeNum(0, dataMax, 0.05, true)"

[lejant]
"canlı" = false
"işaretçi_genişliği" = 0
x_serisi_gizli = true
"değer_hücreleri_gizli" = true
set_series = true
"gruplu_slot_davranışı" = "gizli seri slotu korunur; görünür çubuklar yeniden yayılmaz"
"yığılmış_slot_davranışı" = "kaynak sayfa başlangıçta kümülatif veriyi kurar; gizlenen seri yeniden yığma yapmadan kendi kümülatif katmanını kaldırır"

["etkileşim"]
"kaynak_seçimi_kapalı" = true
kaynak_cursor_x = false
kaynak_cursor_y = false
"çubuk_hover_dikdörtgeni" = true
"çekirdek_vuruş_testi" = true
kaynak_hover_indeksi = "quadtree-bbox"
kaynak_hover_dolgusu = "rgba(255,255,255,0.3)"
"yığılmış_hover_değeri" = "kümülatif-tepe"
"port_ortak_etkileşim_uzantısı_opsiyonel" = true
"port_uzantısı" = ["tekerlek", "seçim", "dokunma", "taşıma", "görünüm-geçmişi", "çift-tık-tam-görünüm"]
"port_uzantısı_kaynak_paritesi_değildir" = true

[performans]
"kaynak_yüzey_sayısı" = 10
geometri_maliyeti = "O(grup_sayısı * seri_sayısı)"
hover_dizini = "Quadtree"
"hover_sorgusu" = "yalnız aday bbox kayıtları"
"yeniden_çizim" = "drawClear sırasında path ve quadtree yeniden kurulur"

["kanıt"]
"masaüstü" = "uygulamalar/masaustu/src/main.rs"
gpui_web = "uygulamalar/web/src/main.rs"
svg_dizini = "target/bars-grouped-stacked"
