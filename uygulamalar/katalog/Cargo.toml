[package]
name = "uplot-rs-gpui-katalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Native ve GPUI Web için ortak uPlot.rs kart kayıt defteri"

[dependencies]
gpui = { path = "../../../gpui/crates/gpui" }
ortak_bilesenler = { path = "../../../gpui_kutuphanesi/kutuphaneler/ortak_bilesenler", features = ["varsayilan_tema", "web"] }
ortak_tema = { path = "../../../gpui_kutuphanesi/kutuphaneler/ortak_tema" }
# Katalog kütüphanenin tanılama koşum takımıdır; izleme feature'ı burada
# açılır, kütüphanenin varsayılan yüzeyinde kapalı kalır.
uplot-rs = { path = "../..", default-features = false, features = ["gpui-svg", "izleme"] }
uplot-rs-gpui-ornekler = { path = "../ornekler", features = ["gpui-svg"] }
web-time = "1.1.0"

[dev-dependencies]
# Kök render bütçesi ölçümü gerçek bir GPUI penceresi ister.
gpui = { path = "../../../gpui/crates/gpui", features = ["test-support"] }
# Boya günlüğü yalnız test derlemesinde açılır; normal katalog yüzeyi
# kayıt tutmaz.
uplot-rs = { path = "../..", features = ["boya-gunlugu"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "History",
    "HtmlAnchorElement",
    "Location",
    "Node",
    "Url",
    "Window",
] }

[lints]
workspace = true
