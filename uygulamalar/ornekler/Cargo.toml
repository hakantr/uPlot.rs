[package]
name = "uplot-rs-gpui-ornekler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "uPlot.rs katalog uygulamaları için örnek veri ve yapılandırmalar"

[features]
default = []
gpui-svg = ["uplot-rs/gpui-svg"]

[dependencies]
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uplot-rs = { path = "../..", default-features = false }
web-time = "1.1.0"

[lints]
workspace = true
