[build]
target = "index.html"
dist = "dist"
public_url = "/"

[serve]
addresses = ["0.0.0.0"]
port = 8081
open = false

# WebGPU ve SharedArrayBuffer için gereken izolasyon başlıkları. Yayınlanan
# statik pakette (GitHub Pages) bunlar gönderilemediğinden aynı işi
# `coi-serviceworker.js` üstlenir.
headers = { "Cross-Origin-Embedder-Policy" = "require-corp", "Cross-Origin-Opener-Policy" = "same-origin" }
