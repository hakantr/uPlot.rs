# Kök workspace'ten ayrı tutulur: bu paket yalnız `wasm32-unknown-unknown`
# hedefine derlenir ve kendi bağımlılık kümesini seçer.
[workspace]

[package]
name = "uplot-rs-gpui-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "uPlot.rs GPUI Web katalog uygulaması"

[[bin]]
name = "uplot-rs-gpui-web"
path = "src/main.rs"

[dependencies]
gpui = { path = "../../../gpui/crates/gpui" }
ortak_bilesenler = { path = "../../../gpui_kutuphanesi/kutuphaneler/ortak_bilesenler", features = ["varsayilan_tema", "web"] }
uplot-rs-gpui-katalog = { path = "../katalog" }

[target.'cfg(target_family = "wasm")'.dependencies]
# `gpui_platform` yerine doğrudan `gpui_web`: o crate `gpui_web`'i varsayılan
# feature'larla çeker ve varsayılan `multithreaded`, `wasm_thread` üzerinden
# atomics hedef özelliğini zorunlu kılar. Atomics açıkken `parking_lot_core`
# nightly gate'i de açılır, yani zincir nightly kanal + `build-std` + on
# satırlık rustflag bakımı demektir. `gpui_platform`'un web tarafı da
# `WebPlatform::new` ve `init_logging` üzerine ince bir sarmalayıcıydı.
#
# `multithreaded` kapalı, çünkü bugün hiçbir işe yaramıyordu: kabuk
# `single_threaded_web()` yolunu kullanıyor ve tarayıcı `crossOriginIsolated`
# olsa bile `SharedArrayBuffer not available; falling back to single-threaded
# dispatcher` düşüyordu. Yani bedeli ödeniyor, karşılığı alınmıyordu.
#
# YENİDEN AÇMA KOŞULU: gpui tarafında iş parçacıklı web yolu gerçekten
# çalışır hâle gelir ve katalog ondan ölçülebilir kazanç sağlarsa
# (`default-features = false` kaldırılır), beraberinde nightly toolchain,
# `build-std` ve atomics rustflag'leri geri gelir. O gün `git log` bu
# commit'i ve kaldırılan `rust-toolchain.toml` / `.cargo/config.toml`
# dosyalarını taşıyor.
gpui_web = { path = "../../../gpui/crates/gpui_web", default-features = false }
console_error_panic_hook = "0.1"
log = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

# Ayrı workspace olduğundan kökteki `workspace.lints` miras alınamaz; aynı
# kurallar burada birebir yinelenir.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
