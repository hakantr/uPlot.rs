# Kök workspace stable kanala sabitlidir. GPUI Web'in çok iş parçacıklı yolu
# nightly ve `build-std` istediğinden bu paket, zed'in `hello_web` örneğinde
# olduğu gibi kendi workspace'i olarak ayrılır: yanındaki `rust-toolchain.toml`
# ve `.cargo/config.toml` yalnız burada geçerli olur.
[workspace]

[package]
name = "uplot-rs-gpui-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "uPlot.rs GPUI Web katalog uygulaması"

[[bin]]
name = "uplot-rs-gpui-web"
path = "src/main.rs"

[dependencies]
gpui = { path = "../../../gpui/crates/gpui" }
ortak_bilesenler = { path = "../../../gpui_kutuphanesi/kutuphaneler/ortak_bilesenler", features = ["varsayilan_tema", "web"] }
uplot-rs-gpui-katalog = { path = "../katalog" }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_platform = { path = "../../../gpui/crates/gpui_platform" }
log = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }

# Ayrı workspace olduğundan kökteki `workspace.lints` miras alınamaz; aynı
# kurallar burada birebir yinelenir.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
