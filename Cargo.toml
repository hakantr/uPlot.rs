[package]
name = "uplot-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "uPlot'un yerli Rust portu"
license = "Apache-2.0"
repository = "https://github.com/hakantr/uPlot.rs"
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/readme_en.md",
    "/LICENSE",
    "/NOTICE",
]

[workspace]
members = [
    "uygulamalar/ornekler",
    "uygulamalar/katalog",
    "uygulamalar/masaustu",
]
# GPUI Web nightly + `build-std` ister; kendi workspace'i olarak ayrıdır.
exclude = ["uygulamalar/web"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[features]
default = []
gpui-svg = []

[dependencies]
gpui = { version = "0.2.2", path = "../gpui/crates/gpui" }
web-time = "1.1.0"

[dev-dependencies]
gpui = { version = "0.2.2", path = "../gpui/crates/gpui", features = ["test-support"] }
