name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cekirdek:
    runs-on: ubuntu-latest
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: Kilitli uPlot
        uses: actions/checkout@v4
        with:
          repository: leeoniya/uPlot
          ref: 0e5812c504430f5c804e0f993376d8999b26cc34
          path: uPlot
      - name: Kilitli GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          ref: bd126568b79160a1684703feb8200d6e243e52aa
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: c97926c3c15ab99091b51f7ed88bd98f357de409
          path: gpui_kutuphanesi
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux sistem bağımlılıkları
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev
          libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev
      - name: Kaynak kilidi ve uyum envanteri
        working-directory: uPlot.rs
        run: npm --prefix tools/uyum run denetle
      - name: Biçim
        working-directory: uPlot.rs
        run: cargo fmt --all --check
      - name: GPUI ve SVG dışa aktarım feature matrisi
        working-directory: uPlot.rs
        run: |
          cargo check -p uplot-rs --lib --no-default-features
          cargo check -p uplot-rs --lib --no-default-features --features gpui-svg
          cargo check -p uplot-rs --lib --all-features
          cargo check -p uplot-rs-gpui-katalog
          cargo check -p uplot-rs-gpui-web --target wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --workspace
      - name: Clippy
        working-directory: uPlot.rs
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Testler
        working-directory: uPlot.rs
        run: cargo test --workspace --all-targets --all-features
      - name: Phase 12 release performans kapıları
        working-directory: uPlot.rs
        env:
          # Üretim kodu unsafe yasağını korur. Sayan GlobalAlloc yalnız bu
          # izole entegrasyon testi için cfg ile derlenir.
          RUSTFLAGS: "--cfg phase12_allocator --cap-lints allow"
        run: >-
          cargo test --release -p uplot-rs --test performance_budgets
          --all-features -- --test-threads=1 --nocapture

  native-platformlar:
    name: native-${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: macos-arm64
            os: macos-14
            hedef: aarch64-apple-darwin
          - ad: windows-x86_64
            os: windows-2025
            hedef: x86_64-pc-windows-msvc
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: Kilitli GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          ref: bd126568b79160a1684703feb8200d6e243e52aa
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: c97926c3c15ab99091b51f7ed88bd98f357de409
          path: gpui_kutuphanesi
      - name: Rust 1.95
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.hedef }}
      - name: Native GPUI kataloğunu doğrula
        working-directory: uPlot.rs
        run: cargo check -p uplot-rs-chart-listesi --target ${{ matrix.hedef }}
