name: ci

# Wasm dışındaki bütün doğrulama. Wasm ayrı bir iş akışındadır
# (`ci-wasm.yml`): GPUI Web kendi workspace'i olduğundan kök `cargo fmt --all`
# ve clippy onu kapsamaz.
on:
  workflow_dispatch:
  schedule:
    # Her gün 02:00 UTC. Push başına çalıştırılmaz.
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cekirdek:
    runs-on: ubuntu-latest
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: Kilitli uPlot
        uses: actions/checkout@v4
        with:
          repository: leeoniya/uPlot
          ref: 0e5812c504430f5c804e0f993376d8999b26cc34
          path: uPlot
      # GPUI ayrı bir depoda geliştirilir ve orada takip edilir; burada
      # sabit bir commit'e kilitlenmez, varsayılan dalın güncel hâli alınır.
      - name: GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: 36f1174423cf4d79f6795f042c6f4b4fa333b91d
          path: gpui_kutuphanesi
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux sistem bağımlılıkları
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev
          libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev
      - name: Kaynak kilidi ve uyum envanteri
        working-directory: uPlot.rs
        run: npm --prefix tools/uyum run denetle
      - name: Biçim
        working-directory: uPlot.rs
        run: cargo fmt --all --check
      # Kart listesi ve örnek kabuklar kütüphaneyi göstermek içindir; ne
      # native ne wasm paketinde yer almamalı. Sınır paket içeriğinden ve
      # bağımlılık yönünden gelir, hedeften değil.
      - name: Paket sınırı
        working-directory: uPlot.rs
        run: ./tools/paket_siniri_denetle.sh
      - name: GPUI ve SVG dışa aktarım feature matrisi
        working-directory: uPlot.rs
        run: |
          cargo check -p uplot-rs --lib --no-default-features
          cargo check -p uplot-rs --lib --no-default-features --features gpui-svg
          cargo check -p uplot-rs --lib --all-features
          cargo check -p uplot-rs-gpui-katalog
      - name: Clippy
        working-directory: uPlot.rs
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Testler
        working-directory: uPlot.rs
        run: cargo test --workspace --all-targets --all-features
      - name: Phase 12 release performans kapıları
        working-directory: uPlot.rs
        env:
          # Üretim kodu unsafe yasağını korur. Sayan GlobalAlloc yalnız bu
          # izole entegrasyon testi için cfg ile derlenir.
          RUSTFLAGS: "--cfg phase12_allocator --cap-lints allow"
        run: >-
          cargo test --release -p uplot-rs-gpui-ornekler --test performance_budgets
          --all-features -- --test-threads=1 --nocapture
      # Kök render bütçesi gerçek bir GPUI penceresi kurar ve yalnız release'de
      # anlamlıdır; debug koşumunda test kendini atlar.
      - name: Katalog kök render bütçesi
        working-directory: uPlot.rs
        run: >-
          cargo test --release -p uplot-rs-gpui-katalog --lib kok_render_kare_butcesi
          -- --test-threads=1 --nocapture

  native-platformlar:
    name: native-${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: macos-arm64
            os: macos-14
            hedef: aarch64-apple-darwin
          - ad: windows-x86_64
            os: windows-2025
            hedef: x86_64-pc-windows-msvc
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: 36f1174423cf4d79f6795f042c6f4b4fa333b91d
          path: gpui_kutuphanesi
      - name: Rust 1.95
        uses: dtolnay/rust-toolchain@1.95
        with:
          targets: ${{ matrix.hedef }}
      - name: Native GPUI kataloğunu doğrula
        working-directory: uPlot.rs
        run: cargo check -p uplot-rs-chart-listesi --target ${{ matrix.hedef }}
