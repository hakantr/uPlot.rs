name: ci-wasm

# Yalnız wasm hedefi. Web uygulaması kendi workspace'i olduğundan (kök
# `cargo fmt --all` ve clippy onu kapsamaz) ayrı iş olarak denetlenir.
# Araç zinciri artık kökle aynı: kabuk `gpui_web`'i `default-features = false`
# ile çektiğinden nightly, `build-std` ve atomics rustflag'leri gerekmiyor.
on:
  workflow_dispatch:
  schedule:
    # Her gün 03:00 UTC; `ci` iş akışıyla çakışmaması için bir saat sonra.
    - cron: "0 3 * * *"

concurrency:
  group: ci-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Çekirdek kütüphane ve katalog wasm hedefinde derleniyor mu?
  kutuphane:
    runs-on: ubuntu-latest
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: 36f1174423cf4d79f6795f042c6f4b4fa333b91d
          path: gpui_kutuphanesi
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - name: Linux sistem bağımlılıkları
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev
          libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev
      - name: Kök workspace wasm derlemesi
        working-directory: uPlot.rs
        run: cargo check --target wasm32-unknown-unknown --workspace

  # GPUI Web uygulaması kendi workspace'idir; kök `cargo fmt --all` ve clippy
  # onu kapsamadığından denetimi burada yapılır.
  web-uygulamasi:
    runs-on: ubuntu-latest
    steps:
      - name: uPlot.rs
        uses: actions/checkout@v4
        with:
          path: uPlot.rs
      - name: GPUI
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui
          path: gpui
      - name: Kilitli GPUI bileşen kütüphanesi
        uses: actions/checkout@v4
        with:
          repository: hakantr/gpui_kutuphanesi
          ref: 36f1174423cf4d79f6795f042c6f4b4fa333b91d
          path: gpui_kutuphanesi
      - name: Rust wasm hedefi
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Linux sistem bağımlılıkları
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev
          libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev
          libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev
      # Web ayrı bir workspace olduğundan kökteki `cargo fmt --all` onu
      # kapsamaz; biçim denetimi burada yapılır.
      - name: Biçim
        working-directory: uPlot.rs/uygulamalar/web
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: uPlot.rs/uygulamalar/web
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      # `trunk build` derlemenin ötesinde wasm-bindgen iş parçacığı dönüşümünü
      # de çalıştırır; eksik `__heap_base` gibi bağlayıcı hataları yalnız bu
      # adımda görünür.
      - name: Trunk derlemesi
        working-directory: uPlot.rs/uygulamalar/web
        run: trunk build
